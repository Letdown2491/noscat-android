[package]
name = "noscat-android"
description = "UniFFI bindings over the noscat client stack for the Android app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
# cdylib: the .so the Android app loads; lib: uniffi-bindgen reads it.
crate-type = ["lib", "cdylib"]

[dependencies]
noscat-core = "0.1.3"
noscat-client = "0.1.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
